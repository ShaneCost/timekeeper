[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "timekeeper"
version = "0.1.0"
description = "Measure elapsed time through three surfaces: a decorator, a context manager, and a generator."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Shane Costello" }]
license = { text = "MIT" }

# Zero runtime dependencies -- standard library only.
dependencies = []

[project.optional-dependencies]
dev = ["mypy", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/timekeeper"]